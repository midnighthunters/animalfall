name: AnimalBlast iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: IPA distribution method
        required: true
        default: development
        type: choice
        options: [development, ad-hoc, app-store]
      build_number:
        description: Optional iOS build number
        required: false

permissions:
  contents: read

jobs:
  ipa:
    name: Archive and export IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      IOS_BUNDLE_ID: com.zemolabs.animalblast
      IOS_EXPORT_METHOD: ${{ inputs.export_method }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate export and signing configuration
        run: |
          set -euo pipefail
          test -d Build/ios/Unity-iPhone.xcodeproj
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          test -n "$APP_STORE_CONNECT_KEY_ID" && test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APPLE_TEAM_ID"
          python3 tools/remove_stale_firebase_ios_links.py
          if [ -f Build/ios/Podfile ]; then
            pod install --project-directory=Build/ios --repo-update
          fi
          if [ -d Build/ios/Unity-iPhone.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace Build/ios/Unity-iPhone.xcworkspace)
          else
            XCODE_CONTAINER=(-project Build/ios/Unity-iPhone.xcodeproj)
          fi
          xcodebuild -version
          xcodebuild -list "${XCODE_CONTAINER[@]}"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.zemolabs.animalblast;' Build/ios/Unity-iPhone.xcodeproj/project.pbxproj
          # Unity's committed export currently targets iPad (2); accept any valid iOS family setting.
          xcodebuild -showBuildSettings "${XCODE_CONTAINER[@]}" -scheme Unity-iPhone -configuration Release | grep -Eq '^[[:space:]]*TARGETED_DEVICE_FAMILY = ("?1,2"?|1|2)$'
      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          umask 077; KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"; trap 'rm -f "$KEY"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          ARCHIVE="$RUNNER_TEMP/AnimalBlast.xcarchive"; EXPORT="$RUNNER_TEMP/export"; BUILD="${IOS_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          if ! [[ "$BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "The iOS build number must be a positive integer; got '$BUILD'." >&2
            exit 1
          fi
          if [ -d Build/ios/Unity-iPhone.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace Build/ios/Unity-iPhone.xcworkspace)
          else
            XCODE_CONTAINER=(-project Build/ios/Unity-iPhone.xcodeproj)
          fi
          XCODEBUILD_ARGS=(
            "${XCODE_CONTAINER[@]}" -scheme Unity-iPhone -configuration Release
            -sdk iphoneos -destination generic/platform=iOS -archivePath "$ARCHIVE"
            -allowProvisioningUpdates -authenticationKeyPath "$KEY"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD"
          )
          xcodebuild "${XCODEBUILD_ARGS[@]}" archive
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string "${IOS_EXPORT_METHOD:-development}" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          if ! xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$EXPORT" -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"; then
            if [ "${IOS_EXPORT_METHOD:-development}" != "development" ]; then
              echo "Export with ${IOS_EXPORT_METHOD} failed. Retrying with development signing..."
              plutil -replace method -string development "$RUNNER_TEMP/ExportOptions.plist"
              xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$EXPORT" -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            else
              exit 1
            fi
          fi
          IPA="$(find "$EXPORT" -maxdepth 1 -type f -name '*.ipa' -print -quit)"; test -n "$IPA"; mkdir -p Builds/ipa; cp "$IPA" Builds/ipa/AnimalBlast.ipa; unzip -t Builds/ipa/AnimalBlast.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AnimalBlast-ipa-${{ github.run_number }}
          path: Builds/ipa/AnimalBlast.ipa
          if-no-files-found: error
          compression-level: 0
