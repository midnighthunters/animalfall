name: AnimalFall Production TestFlight

# ==============================================================================
# TESTFLIGHT REQUIRED SECRETS (Configure in GitHub Settings -> Secrets -> Actions):
# ==============================================================================
# 1. APPLE_TEAM_ID:
#    Your 10-character Apple Developer Team ID (e.g., 2LYFPDG6BB)
# 2. APP_STORE_CONNECT_KEY_ID:
#    Your App Store Connect API Key ID (e.g., NY7B85UQ3M)
# 3. APP_STORE_CONNECT_ISSUER_ID:
#    Your App Store Connect Issuer UUID
# 4. APP_STORE_CONNECT_PRIVATE_KEY:
#    The entire contents of AuthKey_<KEY_ID>.p8 (including -----BEGIN/END PRIVATE KEY-----)
# 5. IOS_CERTIFICATE_BASE64 (Optional for manual signing):
#    Base64 string of your exported Apple Distribution .p12 certificate
#    PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('dist.p12'))
# 6. IOS_CERTIFICATE_PASSWORD (Optional):
#    Password used when exporting the .p12 certificate (or leave blank if unencrypted)
# 7. IOS_PROVISIONING_PROFILE_BASE64:
#    Base64 string of your App Store Provisioning Profile (.mobileprovision)
#    PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('animalfall_prod_profile.mobileprovision'))
# ==============================================================================

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Optional marketing version, for example 1.0.1 (defaults to Info.plist version)
        required: false
        type: string
      build_number:
        description: Optional positive iOS build number (defaults to the GitHub run number)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload production IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '2LYFPDG6BB' }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'NY7B85UQ3M' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 || secrets.PROVISIONING_PROFILE_BASE64 }}
      IOS_BUNDLE_ID: com.zemolabs.animalfall
      IOS_PROJECT_PATH: ${{ github.workspace }}/Build/ios
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode toolchain (Swift 6.2)
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n1)"
          test -n "$xcode_app" || { echo "No suitable Xcode found on this runner image; the LevelPlay/IronSource SDK requires the Swift 6.2 runtime." >&2; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          echo "Using $xcode_app"
          xcodebuild -version

      - name: Validate production release and committed Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            requested_build_number="${{ inputs.build_number }}"
          else
            version="${GITHUB_REF_NAME#v}"
            requested_build_number=""
          fi
          if [[ -z "$version" ]]; then
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$IOS_PROJECT_PATH/Info.plist" 2>/dev/null || echo '1.0.0')"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Production versions must contain only digits and dots; got '$version'." >&2
            exit 1
          }
          build_number="${requested_build_number:-$GITHUB_RUN_NUMBER}"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]] || {
            echo "The iOS build number must be a positive integer; got '$build_number'." >&2
            exit 1
          }
          test -d "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj"
          test -f "$IOS_PROJECT_PATH/Info.plist"
          xcodebuild -version
          xcodebuild -list -project "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj"
          command -v xcrun >/dev/null

          # Validate required credentials:
          # APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY are always required.
          # If IOS_CERTIFICATE_BASE64 is provided, manual signing will be used.
          # Otherwise, automatic signing with App Store Connect API Key will be used.
          secrets_valid=true
          for secret_name in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            val="${!secret_name:-}"
            if [[ -z "$val" ]]; then
              echo "::error::Missing required secret: $secret_name" >&2
              secrets_valid=false
            elif [[ "$val" == REPLACE_WITH_* ]]; then
              echo "::error::Secret $secret_name is currently set to placeholder value '$val'. Please update it with your actual credentials." >&2
              secrets_valid=false
            fi
          done

          # If manual signing credentials are provided, validate they aren't placeholder
          for secret_name in IOS_CERTIFICATE_BASE64 IOS_PROVISIONING_PROFILE_BASE64; do
            val="${!secret_name:-}"
            if [[ "$val" == REPLACE_WITH_* ]]; then
              echo "::error::Secret $secret_name is currently set to placeholder value '$val'." >&2
              secrets_valid=false
            fi
          done

          if [[ "$secrets_valid" != "true" ]]; then
            echo "==================================================================" >&2
            echo "❌ ACTION REQUIRED: Configure TestFlight Secrets in GitHub Settings" >&2
            echo "Navigate to: Repository -> Settings -> Secrets and variables -> Actions" >&2
            echo "" >&2
            echo "Required App Store Connect API secrets:" >&2
            echo "  APPLE_TEAM_ID" >&2
            echo "  APP_STORE_CONNECT_KEY_ID" >&2
            echo "  APP_STORE_CONNECT_ISSUER_ID" >&2
            echo "  APP_STORE_CONNECT_PRIVATE_KEY" >&2
            echo "==================================================================" >&2
            exit 1
          fi

          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;" "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj/project.pbxproj"
          printf 'IOS_MARKETING_VERSION=%s\nIOS_BUILD_NUMBER=%s\n' "$version" "$build_number" >> "$GITHUB_ENV"

      - name: Prepare the committed Xcode project for macOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("Build/ios/Unity-iPhone.xcodeproj/project.pbxproj")
          source = project.read_text(encoding="utf-8")
          patched, replacements = re.subn(r'\s+--usymtool-path=\\".*?\\"', "", source)
          if replacements > 1:
              raise SystemExit(
                  f"Expected at most one Windows usymtool path in {project}, found {replacements}."
              )
          if replacements > 0:
              project.write_text(patched, encoding="utf-8")
          PY
          if [[ -f "tools/remove_stale_firebase_ios_links.py" ]]; then
            python3 tools/remove_stale_firebase_ios_links.py
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" "$IOS_PROJECT_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "$IOS_PROJECT_PATH/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$IOS_PROJECT_PATH/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$IOS_PROJECT_PATH/Info.plist"
          else
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$IOS_PROJECT_PATH/Info.plist"
          fi

      - name: Resolve CocoaPods dependencies when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$IOS_PROJECT_PATH/Podfile" ]]; then
            pod install --project-directory="$IOS_PROJECT_PATH"
            test -d "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace"
          fi

      - name: Prune orphaned CI development certificates
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ci/ios/prune-ci-certs.py ]]; then
            python3 -m venv "$RUNNER_TEMP/cert-venv"
            "$RUNNER_TEMP/cert-venv/bin/pip" install --quiet pyjwt cryptography requests
            "$RUNNER_TEMP/cert-venv/bin/python" ci/ios/prune-ci-certs.py
          fi

      - name: Archive and export App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/AnimalFall.xcarchive"
          export_path="$RUNNER_TEMP/export"
          trap 'rm -f "$key_path"' EXIT
          python3 -c "import os; k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '').replace('\\\\n', '\n').strip(); open(os.environ['RUNNER_TEMP'] + f\"/AuthKey_{os.environ['APP_STORE_CONNECT_KEY_ID']}.p8\", 'w').write(k + '\n')"
          chmod 600 "$key_path"

          # Install repository provisioning profile if present
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          if [[ -f "animalfall_prod_profile.mobileprovision" ]]; then
            cp "animalfall_prod_profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          fi

          if [[ -d "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace" ]]; then
            container=( -workspace "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace" )
          else
            container=( -project "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj" )
          fi

          if [[ -n "$IOS_CERTIFICATE_BASE64" && -n "$IOS_PROVISIONING_PROFILE_BASE64" ]]; then
            echo "Configuring manual code signing with imported .p12 certificate and provisioning profile..."
            keychain_path="$RUNNER_TEMP/ci-signing.keychain-db"
            keychain_password="${IOS_CERTIFICATE_PASSWORD:-animalfall}"
            cert_path="$RUNNER_TEMP/ios-dist.p12"
            profile_path="$RUNNER_TEMP/ci.mobileprovision"
            profile_plist="$RUNNER_TEMP/ci.mobileprovision.plist"

            python3 -c "import os, base64; open('$cert_path', 'wb').write(base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64'].strip())); open('$profile_path', 'wb').write(base64.b64decode(os.environ['IOS_PROVISIONING_PROFILE_BASE64'].strip()))"

            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$cert_path" -k "$keychain_path" -P "$keychain_password" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
            security default-keychain -s "$keychain_path"
            security list-keychains -d user -s "$keychain_path" "${HOME}/Library/Keychains/login.keychain-db"

            security cms -D -i "$profile_path" > "$profile_plist"
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
            profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

            echo "Archiving with manual Apple Distribution signing..."
            xcodebuild archive \
              "${container[@]}" \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -destination generic/platform=iOS \
              -archivePath "$archive_path" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER_APP="$profile_name" \
              PROVISIONING_PROFILE_APP="$profile_uuid" \
              CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
              TARGETED_DEVICE_FAMILY="1,2"

            export profile_name
            python3 -c "import os, plistlib; options = {'method': 'app-store', 'signingStyle': 'manual', 'signingCertificate': 'Apple Distribution', 'teamID': os.environ['APPLE_TEAM_ID'], 'manageAppVersionAndBuildNumber': False, 'stripSwiftSymbols': True, 'uploadSymbols': True, 'provisioningProfiles': {os.environ['IOS_BUNDLE_ID']: os.environ['profile_name']}}; open(os.environ['RUNNER_TEMP'] + '/ExportOptions.plist', 'wb').write(plistlib.dumps(options))"

            echo "Exporting App Store IPA..."
            xcodebuild -exportArchive \
              -archivePath "$archive_path" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$export_path"
          else
            echo "Using automatic App Store Connect API Key signing..."
            xcodebuild archive \
              "${container[@]}" \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -destination generic/platform=iOS \
              -archivePath "$archive_path" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$key_path" \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
              TARGETED_DEVICE_FAMILY="1,2"

            plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert method -string app-store "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert signingStyle -string automatic "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert manageAppVersionAndBuildNumber -bool false "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert stripSwiftSymbols -bool true "$RUNNER_TEMP/ExportOptions.plist"
            plutil -insert uploadSymbols -bool true "$RUNNER_TEMP/ExportOptions.plist"

            if ! xcodebuild -exportArchive \
              -archivePath "$archive_path" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$export_path" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$key_path" \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"; then
              echo "Retrying export with explicit provisioning profile mapping..."
              python3 -c "import os, plistlib; p_path = os.environ['RUNNER_TEMP'] + '/ExportOptions.plist'; p = plistlib.load(open(p_path, 'rb')); p['provisioningProfiles'] = {os.environ['IOS_BUNDLE_ID']: 'animalfall_prod_profile'}; plistlib.dump(p, open(p_path, 'wb'))"
              xcodebuild -exportArchive \
                -archivePath "$archive_path" \
                -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                -exportPath "$export_path" \
                -allowProvisioningUpdates \
                -authenticationKeyPath "$key_path" \
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
                -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            fi
          fi

          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          mkdir -p Builds/ipa
          cp "$ipa_path" Builds/ipa/AnimalFall.ipa
          ls -lh Builds/ipa/AnimalFall.ipa
          unzip -t Builds/ipa/AnimalFall.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AnimalFall-testflight-ipa-${{ github.run_number }}
          path: Builds/ipa/AnimalFall.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload IPA to App Store Connect / TestFlight
        shell: bash
        run: |
          set -euo pipefail
          key_dirs=(
            "$HOME/.appstoreconnect/private_keys"
            "$HOME/.private_keys"
          )
          for kd in "${key_dirs[@]}"; do
            mkdir -p "$kd"
            key_path="$kd/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            KEY_PATH="$key_path" python3 -c "import os; k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '').replace('\\\\n', '\n').strip(); open(os.environ['KEY_PATH'], 'w').write(k + '\n')"
            chmod 600 "$key_path"
          done
          trap 'for kd in "${key_dirs[@]}"; do rm -f "$kd/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" 2>/dev/null || true; done' EXIT

          ipa_path="$GITHUB_WORKSPACE/Builds/ipa/AnimalFall.ipa"
          echo "Uploading $ipa_path to TestFlight using xcrun altool..."
          upload_log="$RUNNER_TEMP/altool_upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$upload_log"
          altool_exit=${PIPESTATUS[0]}
          set -e

          if [[ $altool_exit -eq 0 ]] && ! grep -Eq "UPLOAD FAILED|ERROR:|STATE_ERROR" "$upload_log"; then
            echo "=== TestFlight upload successful via altool! ==="
          else
            echo "Warning: altool upload encountered errors; attempting fallback upload with iTMSTransporter..."
            xcrun iTMSTransporter \
              -m upload \
              -assetFile "$ipa_path" \
              -apiKey "$APP_STORE_CONNECT_KEY_ID" \
              -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
            echo "=== TestFlight upload successful via iTMSTransporter! ==="
          fi
